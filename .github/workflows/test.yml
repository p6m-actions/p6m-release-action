name: Test

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the self-test only reads the checked-out repository.
permissions:
  contents: read

jobs:
  test:
    name: Self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tag_and_commit.sh self-test
        run: ./tests/run.sh
